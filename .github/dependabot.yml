# Keeps what the build and the image take from others up to date, one pull request at a time that check.yml and
# e2e.yml then test: the actions of the workflows (pinned by commit SHA with the version in a comment), the crates
# (pinned `=X.Y.Z` in the Cargo.toml files, so the requirement moves with Cargo.lock), and the base images of
# etc/Dockerfile and etc/e2e/node.Dockerfile. Only versions a week old: a release pulled in its first days never
# reaches the build. The linters of tools/lint.sh are no manifest Dependabot reads: lint-updates.yml watches them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    # An exact requirement is raised to the new version; Cargo's default would only raise one the version breaks.
    versioning-strategy: increase
    groups:
      crates:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/etc, /etc/e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
