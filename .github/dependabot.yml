# Keeps what the build and the image take from others up to date, one pull request at a time that check.yml and
# e2e.yml then test: the actions of the workflows (pinned by commit SHA with the version in a comment), the crates
# of Cargo.lock, and the base images of etc/Dockerfile. Only versions a week old: a release pulled in its first days
# never reaches the build.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      crates:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /etc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
