# Every push to `main` rewrites limen's draft release (spec §11), with xoa-base's workflow: convco reads the
# conventional commits that touched what goes into the binary and the image and says the next `X.Y.Z`. It publishes
# nothing and builds nothing: publishing is release.yml, run by hand.
name: release-draft

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  draft:
    permissions:
      contents: write # rewrite the draft release
    uses: xoadev/xoa-base/.github/workflows/release-draft.yml@f954d79208ba1fc9819abd78dd5392cc30644e10 # v0.2.1
    with:
      # What ends up in the binary or the image: the code, the toolchain and dependencies, the image.
      paths: crates,Cargo.toml,Cargo.lock,rust-toolchain.toml,.cargo,etc/Dockerfile
      title: limen
