# Every push to `main` that touches `packs/` rewrites one draft per pack (spec §11), with xoa-base's workflow: convco
# reads the conventional commits that touched `packs/<pack>/` and says its next `X.Y.Z`. The tag is
# `pack-<pack>-vX.Y.Z`, so limen's own `vX.Y.Z` and every pack keep apart, each with its own history (no slash: a tag's
# name is also a path in its download URLs), and a pack's release is never the latest: that is limen's. Run by hand
# (make pack-drafts), it rewrites every pack's draft as a push would. Publishing a pack is packs.yml.
name: packs-draft

on:
  push:
    branches: [main]
    paths: [packs/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The packs there are, every folder under packs/, from main only: a draft points at the commit this run is on.
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - name: On main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Not main::drafts are rewritten from main, not $REF" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List them
        id: list
        run: |
          packs=$(find packs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')
          echo "packs=$packs" >> "$GITHUB_OUTPUT"
          echo "packs: $packs"

  draft:
    needs: list
    strategy:
      matrix:
        pack: ${{ fromJSON(needs.list.outputs.packs) }}
    permissions:
      contents: write # rewrite the drafts
    uses: xoadev/xoa-base/.github/workflows/release-draft.yml@ab8289f4ac715bcbf0bb070ce386402b3aa9d8b7 # v0.2.1
    with:
      paths: packs/${{ matrix.pack }}
      tag-prefix: pack-${{ matrix.pack }}-v
      title: limen pack ${{ matrix.pack }}
      latest: false
