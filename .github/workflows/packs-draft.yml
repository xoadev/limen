# Every push to `main` that touches `packs/` rewrites one draft per pack that changed (spec §11). It publishes
# nothing: publishing a pack is packs.yml, run by hand with its name.
#
# convco reads the conventional commits that touched `packs/<pack>/` and says its next `X.Y.Z`. The tag is
# `pack-<pack>-vX.Y.Z`, so limen's own `vX.Y.Z` and every pack keep apart, each with its own history. No slash in it:
# a tag's name is also a path in its download URLs.
#
# Run by hand (make pack-drafts), it rewrites every pack's draft as a push would: the first drafts, or after a draft
# was deleted, need no change under packs/ to appear.
#
# convco runs with a token that only reads and no credentials left on disk; the job that writes the drafts runs only
# `gh` on what convco said.
name: packs-draft

on:
  push:
    branches: [main]
    paths: [packs/**]
  workflow_dispatch:

permissions:
  contents: read

# The same group as packs.yml, one at a time and never cancelled: a push while a pack is being built would move its
# draft under it.
concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  # The packs there are: every folder under packs/.
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      # A draft points at the commit this run is on: only main's.
      - name: On main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Not main::drafts are rewritten from main, not $REF" >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List them
        id: list
        run: |
          packs=$(find packs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')
          echo "packs=$packs" >> "$GITHUB_OUTPUT"
          echo "packs: $packs"

  # Each pack's next version and changes, by convco, handed over as a file: a matrix's jobs can't each set an output.
  version:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        pack: ${{ fromJSON(needs.list.outputs.packs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version and changes
        id: version
        uses: xoadev/convco-version@97bbabfd76db29aaa7046eebcfb419a4e892449a # v1.0.1
        with:
          paths: packs/${{ matrix.pack }}
          tag-prefix: pack-${{ matrix.pack }}-v

      - name: Write them down
        env:
          PACK: ${{ matrix.pack }}
          TAG: ${{ steps.version.outputs.next-version-tag }}
          VERSION: ${{ steps.version.outputs.next-version }}
          HAS_CHANGES: ${{ steps.version.outputs.has-changes }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          mkdir -p "version/$PACK"
          printf '%s' "$TAG" > "version/$PACK/tag"
          printf '%s' "$VERSION" > "version/$PACK/version"
          printf '%s' "$HAS_CHANGES" > "version/$PACK/has-changes"
          printf '%s' "$CHANGELOG" > "version/$PACK/changelog"

      - name: Hand them over
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-${{ matrix.pack }}
          path: version/
          retention-days: 1

  # One draft per pack, always the one of its next version. Only `gh`, no checkout.
  draft:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # rewrite the drafts
    steps:
      - name: What version said
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: version-*
          path: version
          merge-multiple: true

      - name: Rewrite the drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          drafts=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')
          for dir in version/*/; do
            pack=$(basename "$dir")
            tag=$(cat "$dir/tag")
            version=$(cat "$dir/version")
            has_changes=$(cat "$dir/has-changes")
            if [[ "$has_changes" == true && "$tag" != "pack-$pack-v$version" ]]; then
              echo "::error title=Version::convco said '$tag' for $pack, not pack-$pack-v$version" >&2
              exit 1
            fi
            if [[ "$has_changes" == true && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::convco said '$version' for $pack, not X.Y.Z" >&2
              exit 1
            fi
            while read -r stale; do
              [[ "$stale" == "pack-$pack-v"* ]] || continue
              if [[ "$stale" != "$tag" || "$has_changes" != true ]]; then
                gh release delete "$stale" --yes
              fi
            done <<< "$drafts"
            if [[ "$has_changes" != true ]]; then
              echo "draft: $pack has nothing to release"
              continue
            fi
            case "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null || echo none)" in
              true) gh release edit "$tag" --draft --target "$GITHUB_SHA" --notes-file "$dir/changelog" ;;
              none) gh release create "$tag" --draft --latest=false --target "$GITHUB_SHA" --title "limen pack $pack $version" --notes-file "$dir/changelog" ;;
              *)
                echo "::error title=Published::$tag is already published; the next change to $pack must bump its version" >&2
                exit 1
                ;;
            esac
            echo "draft: $tag"
          done
