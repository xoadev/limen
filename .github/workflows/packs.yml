# Publishes one pack's draft release (spec §11), run by hand with the pack's name (Actions → packs, or
# `make pack-release PACK=<pack> PUBLISH=1`), with xoa-base's workflow: at the draft's commit, once check.yml is green
# on it, `make pack` packs the folder as `limen-pack-<pack>-<version>.tar.gz` —the same bytes from the same commit,
# whoever builds it— with its `SHA256SUMS`; then they are attested, put on the draft and the draft is published, never
# as the latest release: that is limen's. Unticked `publish`, it builds it and publishes nothing.
name: packs

on:
  workflow_dispatch:
    inputs:
      pack:
        description: The pack to publish, e.g. system
        type: string
        required: true
      publish:
        description: Publish its draft once it is built (unticked, only build it)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The name goes into a tag and a make command: only a folder under packs/.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A pack there is
        env:
          PACK: ${{ inputs.pack }}
        run: |
          if ! [[ "$PACK" =~ ^[a-z0-9][a-z0-9_-]*$ && -d "packs/$PACK" ]]; then
            echo "::error title=Pack::no pack '$PACK' under packs/" >&2
            exit 1
          fi

  release:
    needs: pack
    permissions:
      contents: write # see the draft, its files, publishing it
      actions: read # read the check of the commit
      packages: write # unused: a pack has no image, but a called workflow cannot ask for more than this job grants
      id-token: write # attest, keyless (Sigstore)
      attestations: write # store the attestations
    uses: xoadev/xoa-base/.github/workflows/release.yml@f954d79208ba1fc9819abd78dd5392cc30644e10 # v0.2.1
    with:
      tag-prefix: pack-${{ inputs.pack }}-v
      build: pack PACK=${{ inputs.pack }}
      latest: false
      publish: ${{ inputs.publish }}
