# Each pack under packs/ is released on its own, apart from limen and from the other packs (spec §11).
#
# Every push to `main` rewrites one draft per pack that changed: convco reads the conventional commits that touched
# `packs/<pack>/` and says its next `X.Y.Z`. The tag is `pack-<pack>-vX.Y.Z`, so limen's own `vX.Y.Z` and every
# pack keep apart, each with its own history. No slash in it: a tag's name is also a path in its download URLs.
#
# Publishing is running this workflow by hand with the pack's name. It takes that pack's draft, waits for check.yml
# to be green on its commit, packs the folder as `limen-pack-<pack>-<version>.tar.gz` —the same bytes from the same
# commit, whoever builds it— with its `SHA256SUMS`, attests it and only then publishes the draft, never as the latest
# release: that is limen's, which install.sh, limen_version and limen_update ask GitHub for.
#
# As in release.yml, the jobs that run someone else's code (convco) hold a token that only reads, and the ones that
# write run only `gh` and `attest` on what the others handed over.
name: packs

on:
  push:
    branches: [main]
    paths: [packs/**]
  workflow_dispatch:
    inputs:
      pack:
        description: The pack to publish, e.g. system
        type: string
        required: true
      publish:
        description: Publish its draft once it is built (unticked, only build it)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  # The packs there are: every folder under packs/.
  list:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List them
        id: list
        run: |
          packs=$(find packs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')
          echo "packs=$packs" >> "$GITHUB_OUTPUT"
          echo "packs: $packs"

  # Each pack's next version and changes, by convco, handed over as a file: a matrix's jobs can't each set an output.
  version:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        pack: ${{ fromJSON(needs.list.outputs.packs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version and changes
        id: version
        uses: xoadev/convco-version@97bbabfd76db29aaa7046eebcfb419a4e892449a # v1.0.1
        with:
          paths: packs/${{ matrix.pack }}
          tag-prefix: pack-${{ matrix.pack }}-v

      - name: Write them down
        env:
          PACK: ${{ matrix.pack }}
          TAG: ${{ steps.version.outputs.next-version-tag }}
          VERSION: ${{ steps.version.outputs.next-version }}
          HAS_CHANGES: ${{ steps.version.outputs.has-changes }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          mkdir -p "version/$PACK"
          printf '%s' "$TAG" > "version/$PACK/tag"
          printf '%s' "$VERSION" > "version/$PACK/version"
          printf '%s' "$HAS_CHANGES" > "version/$PACK/has-changes"
          printf '%s' "$CHANGELOG" > "version/$PACK/changelog"

      - name: Hand them over
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-${{ matrix.pack }}
          path: version/
          retention-days: 1

  # One draft per pack, always the one of its next version. Only `gh`, no checkout.
  draft:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # rewrite the drafts
    steps:
      - name: What version said
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: version-*
          path: version
          merge-multiple: true

      - name: Rewrite the drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          drafts=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')
          for dir in version/*/; do
            pack=$(basename "$dir")
            tag=$(cat "$dir/tag")
            version=$(cat "$dir/version")
            has_changes=$(cat "$dir/has-changes")
            if [[ "$has_changes" == true && "$tag" != "pack-$pack-v$version" ]]; then
              echo "::error title=Version::convco said '$tag' for $pack, not pack-$pack-v$version" >&2
              exit 1
            fi
            if [[ "$has_changes" == true && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::convco said '$version' for $pack, not X.Y.Z" >&2
              exit 1
            fi
            while read -r stale; do
              [[ "$stale" == "pack-$pack-v"* ]] || continue
              if [[ "$stale" != "$tag" || "$has_changes" != true ]]; then
                gh release delete "$stale" --yes
              fi
            done <<< "$drafts"
            if [[ "$has_changes" != true ]]; then
              echo "draft: $pack has nothing to release"
              continue
            fi
            case "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null || echo none)" in
              true) gh release edit "$tag" --draft --target "$GITHUB_SHA" --notes-file "$dir/changelog" ;;
              none) gh release create "$tag" --draft --latest=false --target "$GITHUB_SHA" --title "limen pack $pack $version" --notes-file "$dir/changelog" ;;
              *)
                echo "::error title=Published::$tag is already published; the next change to $pack must bump its version" >&2
                exit 1
                ;;
            esac
            echo "draft: $tag"
          done

  # The draft of the pack asked for: its version and commit. A token that writes, because drafts are not visible to
  # one that only reads; only `gh`.
  what:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # see the draft
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      version: ${{ steps.draft.outputs.version }}
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - name: The draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACK: ${{ inputs.pack }}
        run: |
          if [[ ! "$PACK" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error title=Pack::'$PACK' is not a pack's name" >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
          tag=$(PREFIX="pack-$PACK-v" gh release list --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft and (.tagName | startswith($ENV.PREFIX))) | .tagName] | first // empty')
          if [[ -z "$tag" ]]; then
            echo "::error title=No draft::$PACK has no draft release: nothing changed in packs/$PACK since its last one" >&2
            exit 1
          fi
          sha=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          version=${tag#"pack-$PACK-v"}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Draft::the draft is '$tag' at '$sha', not pack-$PACK-vX.Y.Z at a commit" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "what: $tag at $sha"

  # The tarball and its SHA256SUMS, made with a token that can only read.
  build:
    needs: what
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read the check of the commit being published
    env:
      PACK: ${{ inputs.pack }}
      VERSION: ${{ needs.what.outputs.version }}
      SHA: ${{ needs.what.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.what.outputs.sha }}
          persist-credentials: false

      - name: The check of this commit is green
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow check.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "::error title=No check::check.yml never ran on $SHA; a pack is only published from a commit of main" >&2
            exit 1
          fi
          gh run watch "$run" --interval 30 --exit-status > /dev/null || {
            echo "::error title=Check failed::check.yml run $run is not green on $SHA" >&2
            exit 1
          }

      - name: Pack it
        run: make pack PACK="$PACK" VERSION="$VERSION"

      - name: Hand it over
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pack-${{ inputs.pack }}-${{ needs.what.outputs.version }}-build${{ github.run_number }}
          path: dist/
          retention-days: 14

  # Only when publishing, and only `gh` and `attest` on what build made.
  publish:
    needs: [what, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the draft's files, and publishing it
      id-token: write # sign the attestation, keyless (Sigstore)
      attestations: write # store it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACK: ${{ inputs.pack }}
      TAG: ${{ needs.what.outputs.tag }}
      SHA: ${{ needs.what.outputs.sha }}
      VERSION: ${{ needs.what.outputs.version }}
    steps:
      - name: The draft is still the one built
        run: |
          now=$(gh release view "$TAG" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"')
          if [[ "$now" != "true $SHA" ]]; then
            echo "::error title=Draft moved::$TAG is now '$now', not a draft at $SHA; run this again" >&2
            exit 1
          fi

      - name: What build made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-${{ inputs.pack }}-${{ needs.what.outputs.version }}-build${{ github.run_number }}
          path: dist

      - name: Attest the tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/limen-pack-*

      - name: The files on the draft, then publish it, never as the latest
        run: |
          name=limen-pack-$PACK-$VERSION.tar.gz
          notes="$RUNNER_TEMP/notes.md"
          {
            gh release view "$TAG" --json body --jq .body
            echo
            echo "**limen pack $PACK $VERSION** · build $GITHUB_RUN_NUMBER"
            echo
            echo "- \`$name\`: the folder \`$PACK/\`, owned by root and writable only by its owner. Unpack it where the machine's \`limen.toml\` lists it, as [docs/scripts.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/scripts.md#released-packs) says."
            echo "- \`SHA256SUMS\`: to check what you downloaded. Pin that hash, not only the tag."
            echo
            echo "\`gh attestation verify $name --repo $GITHUB_REPOSITORY\` says it was built by this repository's packs workflow."
          } > "$notes"
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes-file "$notes"
          gh release edit "$TAG" --draft=false --latest=false
          echo "published: $TAG at $SHA"
