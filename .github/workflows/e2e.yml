# `make e2e` on demand: containers with a real SSH server, Debian and OpenWrt, `limen install` inside, and the hub
# against them. Label a PR `e2e` to run it there; it needs Docker and minutes, so it is not in `check.yml`.
name: e2e

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KOTLIN_CLI_JAVA_OPTIONS: -Xmx3g
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain and dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan
            ~/.cache/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin/kotlin', 'kotlin/gradle/libs.versions.toml', 'kotlin/**/module.yaml') }}
          restore-keys: kotlin-${{ runner.os }}-

      - name: make e2e
        run: make e2e
