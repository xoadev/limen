# `make lint-updates` once a week: the linters pinned in tools/lint.sh are invisible to Dependabot, so this says when
# one has a release a week old, in one open issue that is reused. Bumping it is a pull request (AGENTS.md).
name: lint-updates

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make lint-updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make -s lint-updates > "$RUNNER_TEMP/lint-updates.txt"

      - name: Open or comment the lint-updates issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/lint-updates.txt`, 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `\`make lint-updates\` says:\n\n\`\`\`text\n${report}\`\`\`\n\nRun: ${runUrl}\n\n` +
              'Bump it in `tools/lint.sh` with its checksums, in a pull request (AGENTS.md, "Makefile targets only").';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'lint-updates',
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'A pinned linter is behind', body, labels: ['lint-updates'] });
            }
