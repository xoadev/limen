# Publishes limen's draft release (spec §11), run by hand (Actions → release, or `make release PUBLISH=1`), with
# xoa-base's workflow: at the draft's commit, once check.yml is green on it, `make release-files` builds both static
# binaries release, runs every end-to-end scene with them and builds the hub image for both architectures; then the
# files go on the draft, the image to ghcr.io, both attested, and the draft is published as the latest release, the
# one install.sh, limen_version and limen_update ask GitHub for. Unticked `publish`, it builds all of it and
# publishes nothing.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the draft once it is built (unticked, only build it)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # see the draft, its files, publishing it
      actions: read # read the check of the commit
      packages: write # the image, to ghcr.io
      id-token: write # attest, keyless (Sigstore)
      attestations: write # store the attestations
    uses: xoadev/xoa-base/.github/workflows/release.yml@f954d79208ba1fc9819abd78dd5392cc30644e10 # v0.2.1
    with:
      build: release-files
      image: true
      publish: ${{ inputs.publish }}
