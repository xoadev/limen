# Releases are prepared as they go and published when somebody decides to (spec §11).
#
# Every push to `main` rewrites the draft release: convco reads the conventional commits that touched what goes into
# the binary and the image, and says the next `X.Y.Z` and what went in since the last published one. A draft makes no
# tag and builds nothing. Publishing it —by a person, from the releases page: a release published with this
# workflow's own token would not start another workflow— creates the `vX.Y.Z` tag, and that is what builds and
# publishes: the static binaries for x86-64 and arm64 and the hub image for both, with the tag's number stamped into
# `limen --version`.
#
# What is published is built **release**, not the debug variant the repository is worked on with: smaller and
# optimised, which is what goes on a router.
#
# A `workflow_dispatch` builds everything to prove it builds, and publishes nothing.
#
# No job that runs someone else's code holds a token that writes: convco, the compiler, the build scripts of the
# crates, QEMU and BuildKit run with `contents: read` and no credentials left on disk. What writes —the draft, the
# release's files, the image— runs only `gh` and `skopeo`, on what the read-only jobs handed over.
name: release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What the next version is and what went in: convco, a binary the action downloads, reads the history here with a
  # token that can't write anything.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.next-version-tag }}
      version: ${{ steps.version.outputs.next-version }}
      has-changes: ${{ steps.version.outputs.has-changes }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # convco reads every commit since the last tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Next version and changes
        id: version
        uses: xoadev/convco-version@d00ff5e010d01a62143731de34ab6a4a8c17ce16 # v1.0.0
        with:
          # What ends up in the binary or the image: the code, the toolchain and dependencies, the image.
          paths: crates,Cargo.toml,Cargo.lock,rust-toolchain.toml,.cargo,etc/Dockerfile
          tag-prefix: v

  # One draft, always the one of the next version: a `feat` after a `fix` turns 0.1.1 into 0.2.0, and the draft of
  # 0.1.1 would otherwise stay there, announcing a version that is never going to exist. Only `gh`, no checkout.
  draft:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # rewrite the draft release
    steps:
      - name: Rewrite the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          HAS_CHANGES: ${{ needs.version.outputs.has-changes }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          if [[ "$HAS_CHANGES" == true && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::convco said '$TAG', not vX.Y.Z" >&2
            exit 1
          fi
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
            while read -r stale; do
              if [[ "$stale" != "$TAG" || "$HAS_CHANGES" != true ]]; then
                gh release delete "$stale" --yes
              fi
            done
          if [[ "$HAS_CHANGES" != true ]]; then
            echo "draft: nothing to release"
            exit 0
          fi
          # A published release is never turned back into a draft.
          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo none)" in
            true) gh release edit "$TAG" --draft --target "$GITHUB_SHA" --notes "$CHANGELOG" ;;
            none) gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "limen $VERSION" --notes "$CHANGELOG" ;;
            *)
              echo "::error title=Published::$TAG is already published; the next change must bump the version" >&2
              exit 1
              ;;
          esac
          echo "draft: $TAG"

  # Everything that is published, built and tried with a token that can only read: the binaries, SHA256SUMS and the
  # image for both architectures as an OCI archive, handed to `publish` as an artifact.
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Both binaries, linked one after the other by `make cli`; `make docker` goes through it and finds them done.
      ARCH: x86_64 aarch64
    permissions:
      contents: read
      actions: read # read the check of the commit being published
    outputs:
      version: ${{ steps.what.outputs.version }}
      date: ${{ steps.what.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache at all, unlike `check.yml`: what is published must not depend on what another run left behind. The
      # toolchain comes from rustup and the crates from crates.io, both checked against their hashes.

      # What is published and what number it says, settled before anything is built. The stamp goes to the
      # environment of every later step: cargo reads it at build time, and a step without it would rebuild the
      # binaries saying `dev`.
      - name: Version and stamp
        id: what
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::the tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
              exit 1
            fi
          else
            version=dev
          fi
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "LIMEN_VERSION=$version"
            echo "LIMEN_BUILD_DATE=$date"
            echo "LIMEN_BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "release: $version, build $GITHUB_RUN_NUMBER"

      # The usual gate, read and not run again: the commit a draft points at is a commit of `main`, and check.yml
      # ran on it when it got there. Published right after a merge, it may still be running: then this waits.
      - name: The check of this commit is green
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow check.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "::error title=No check::check.yml never ran on $GITHUB_SHA; a release is only published from a commit of main" >&2
            exit 1
          fi
          echo "gate: check.yml run $run on $GITHUB_SHA"
          gh run watch "$run" --interval 30 --exit-status > /dev/null || {
            echo "::error title=Check failed::check.yml run $run is not green on $GITHUB_SHA" >&2
            exit 1
          }
          echo "gate: green"

      - name: Build the binaries
        run: make cli VARIANT=release

      # The binary that is published, not the debug one the pull requests were tested with: a release link optimises
      # and drops sections, and the static link must survive that. Every scene, with the x86-64 release binary and
      # the hub image built from it.
      - name: The end-to-end scenes, with the release binary
        run: make e2e VARIANT=release

      - name: Gather what is published
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          mkdir -p release
          # Named after what `uname -m` says, so `limen-<version>-linux-$(uname -m)` is the one to download.
          for arch in x86_64 aarch64; do
            cp "$(VARIANT=release tools/cargo.sh artifact "$arch")" "release/limen-$VERSION-linux-$arch"
            file "release/limen-$VERSION-linux-$arch" | grep -Eq "static(-pie)?(ally)? linked" || {
              echo "::error title=Not static::limen-$VERSION-linux-$arch is not statically linked" >&2
              exit 1
            }
          done
          # `./*` and not `*`: a name starting with a dash would slip into sha256sum as an option.
          (cd release && sha256sum ./* > SHA256SUMS)
          ls -l release

      # The image is one tag for amd64 and arm64. Starting the arm64 half to check it runs it as arm64, so this x86-64
      # runner emulates it; buildx is what puts both halves under one tag. Both images pinned by digest: they run
      # privileged, and what they are must not change under a moving tag.
      - name: QEMU, to start the arm64 image on this runner
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
          platforms: arm64

      - name: Buildx, for both architectures under one tag
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.27.0@sha256:054d632d0d7e94b11cdc6048674773499a5170cf7d8ce0c326daaff6be43c8e0

      # Through the same `make docker` as a local build, with the binaries just gathered. Each architecture is built
      # on its own first and started, so a binary that does not run on its platform stops the release before
      # anything is handed over; then both, as one OCI archive.
      - name: Build the hub image and start it on both architectures
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          binaries=(BINARY_AMD64="$PWD/release/limen-$VERSION-linux-x86_64" BINARY_ARM64="$PWD/release/limen-$VERSION-linux-aarch64")
          for arch in amd64 arm64; do
            make docker VARIANT=release PLATFORMS="linux/$arch" IMAGE="limen:$VERSION-$arch" "${binaries[@]}"
            docker run --rm --platform "linux/$arch" "limen:$VERSION-$arch" --version
            test "$(docker image inspect --format '{{.Architecture}}' "limen:$VERSION-$arch")" = "$arch"
          done
          make docker VARIANT=release PLATFORMS=linux/amd64,linux/arm64 IMAGE="limen:$VERSION" OCI="$RUNNER_TEMP/image.tar" \
            "${binaries[@]}" \
            LABELS="org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} org.opencontainers.image.version=$VERSION org.opencontainers.image.revision=$GITHUB_SHA org.opencontainers.image.licenses=Apache-2.0"
          mv "$RUNNER_TEMP/image.tar" release-image.tar

      - name: Hand over what is published
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: limen-${{ steps.what.outputs.version }}-build${{ github.run_number }}
          path: |
            release/
            release-image.tar
          retention-days: 14

  # Only for a published release, and only `gh` and `skopeo` on what `build` made: nothing is compiled or started
  # while this job's token can write.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the release's files
      packages: write # publish the image to ghcr.io
    steps:
      - name: What build made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: limen-${{ needs.build.outputs.version }}-build${{ github.run_number }}

      - name: Publish the image
        env:
          VERSION: ${{ needs.build.outputs.version }}
          # Through the environment, never interpolated into the script: it stays out of the shell's argv and logs.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          for tag in "$VERSION" "build$GITHUB_RUN_NUMBER" latest; do
            skopeo copy --all --quiet oci-archive:release-image.tar "docker://$image:$tag"
          done
          skopeo inspect --raw "docker://$image:$VERSION" | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"'

      # The release already exists —it was the draft— and says what went in; this adds what was built below it.
      # Files are added, never replaced: gh refuses one that is already there.
      - name: Publish the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_DATE: ${{ needs.build.outputs.date }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          notes="$RUNNER_TEMP/notes.md"
          {
            gh release view "$GITHUB_REF_NAME" --json body --jq .body
            echo
            echo "**limen $VERSION** · build $GITHUB_RUN_NUMBER · $BUILD_DATE"
            echo
            echo "- \`$image:$VERSION\`: the hub, for amd64 and arm64 under one tag. Start it and join machines as the [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#install) says."
            echo "- \`limen-$VERSION-linux-x86_64\` and \`limen-$VERSION-linux-aarch64\`: one static binary per architecture, for any Linux (Debian, Ubuntu, OpenWrt…). \`install.sh\` picks the one \`uname -m\` names."
            echo "- \`SHA256SUMS\`: to check what you downloaded."
          } > "$notes"
          gh release upload "$GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
