# `make check` on every push to main and every pull request: the one mandatory gate, and what a release waits for.
# The end-to-end scenes are e2e.yml: they need Docker and several minutes, and run on the pull requests that touch
# what they cover.
name: check

on:
  push:
    branches: [main]
  pull_request:
    # edited: a new title changes the squash commit, and so the version it releases.
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An edit of the description runs the title only, in a group of its own, so it never cancels a full run.
  group: check-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    uses: xoadev/xoa-base/.github/workflows/title.yml@ab8289f4ac715bcbf0bb070ce386402b3aa9d8b7 # v0.2.1

  check:
    # Editing the description re-runs the workflow for the title only.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Every action pinned by commit SHA, with its version in a comment: a tag can move, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain, dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      # The linters of xoa-base's lint/*.mk: GitHub's runner brings shellcheck only, and xoa-base's action the rest.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: xoadev/xoa-base/.github/actions/linters@ab8289f4ac715bcbf0bb070ce386402b3aa9d8b7 # v0.2.1

      # `-k`: every check runs even when one fails, so a red build says everything that is wrong at once.
      - name: make -k check
        run: make -k check

      # `make check` builds and tests this runner's architecture only. Both static binaries are linked here too, so a
      # change that breaks one is found on its pull request and not when a release is being published.
      - name: Both binaries link, statically
        run: |
          make cli ARCH="x86_64 aarch64"
          file "$(tools/cargo.sh artifact x86_64)" | tee /dev/stderr | grep -Eq "x86-64.*static(-pie)?(ally)? linked"
          file "$(tools/cargo.sh artifact aarch64)" | tee /dev/stderr |
            grep -Eq "ARM aarch64.*static(-pie)?(ally)? linked"

  # A red `main` must be impossible to miss: one open issue, reused, that says which commit broke it.
  alert:
    needs: check
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'main is red';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `\`make check\` failed on \`main\` at ${context.sha.slice(0, 7)}.\n\n` +
              `Run: ${runUrl}\n\nFixed like everything else: a branch, a PR and a green \`check\` (AGENTS.md).`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'main-red',
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['main-red'] });
            }
