[package]
name = "limen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "derive", "error-context", "suggestions"] }
limen-core = { path = "../limen-core" }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf-dfa", "perf-backtrack"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process", "event", "termios", "system", "param", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
